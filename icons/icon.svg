<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF453A"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- iOS Squircle / Rounded Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Chopsticks -->
  <line x1="180" y1="210" x2="380" y2="135" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <line x1="190" y1="225" x2="390" y2="160" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- Vitality Steam / Pulse Lines -->
  <path d="M 215 195 Q 200 160 215 135 T 215 95" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
  <path d="M 256 185 Q 240 145 256 115 T 256 75" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity="0.95"/>
  <path d="M 297 195 Q 312 160 297 135 T 297 95" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.8"/>

  <!-- Noodle Bowl -->
  <ellipse cx="256" cy="235" rx="130" ry="24" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-width="14"/>
  <path d="M 126 235 C 130 330 180 375 256 375 C 332 375 382 330 386 235" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>

  <!-- Bowl Pedestal -->
  <line x1="205" y1="388" x2="307" y2="388" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
</svg>
